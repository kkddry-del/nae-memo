(()=>{'use strict';const KEY='simple_memo_v02',OLD='simple_memo_v01';const $=id=>document.getElementById(id);let state,selected='all',editing=null,sortMode=0,snapshot='',listMoveId=null;const SETTINGS_KEY='simple_memo_display_v12';const defaults={font:16,line:1.6,width:100};let display={...defaults};try{display={...defaults,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch{}function applyDisplay(){display.font=Math.min(28,Math.max(12,Number(display.font)||16));display.line=Math.min(2.5,Math.max(1.2,Number(display.line)||1.6));display.width=Math.min(100,Math.max(60,Number(display.width)||100));document.documentElement.style.setProperty('--memo-font',display.font+'px');document.documentElement.style.setProperty('--memo-line',String(display.line));document.documentElement.style.setProperty('--memo-width',display.width+'%');$('fontSize').value=display.font;$('lineHeight').value=display.line;$('lineWidth').value=display.width;$('fontSizeValue').textContent=display.font+'px';$('lineHeightValue').textContent=display.line.toFixed(1)+'배';$('lineWidthValue').textContent=display.width+'%';document.querySelectorAll('.check-text').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})}function setDisplay(){display={font:Number($('fontSize').value),line:Number($('lineHeight').value),width:Number($('lineWidth').value)};applyDisplay();try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(display))}catch{}}$('settingsBtn').onclick=()=>{$('settingsDialog').showModal()};$('closeSettings').onclick=()=>$('settingsDialog').close();$('resetSettings').onclick=()=>{display={...defaults};applyDisplay();setDisplay()};['fontSize','lineHeight','lineWidth'].forEach(id=>$(id).addEventListener('input',setDisplay));applyDisplay();const uid=()=>String(Date.now())+'_'+Math.random().toString(36).slice(2,8);const blank=()=>({folders:[{id:'default',name:'기본 폴더'}],notes:[]});try{state=JSON.parse(localStorage.getItem(KEY))||blank();if(!Array.isArray(state.folders)||!Array.isArray(state.notes))state=blank()}catch{state=blank()}if(!state.folders.some(f=>f.id==='default'))state.folders.unshift({id:'default',name:'기본 폴더'});function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('저장 공간에 문제가 있어 저장하지 못했습니다. 메모를 파일로 저장해 주세요.');return false}}function el(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}function folderName(id){return state.folders.find(f=>f.id===id)?.name||'기본 폴더'}let expandedFolders=new Set();
function noteCard(n){const row=el('div',undefined,'item nested-note');const b=el('button',undefined,'open');b.append(el('strong',n.title||'제목 없음'),el('small',new Date(n.updated).toLocaleString('ko-KR')));b.onclick=()=>{openNote(n.id);document.body.classList.remove('sidebar-open')};const d=el('button','삭제','danger');d.setAttribute('aria-label',(n.title||'제목 없음')+' 삭제');d.onclick=()=>removeNote(n.id);const m=el('button','이동','move-list');m.setAttribute('aria-label',(n.title||'제목 없음')+' 폴더 이동');m.onclick=()=>openMoveDialog(n.id);row.append(b,d,m);return row}

nu.replaceChildren();state.folders.forEach(f=>{const option=el('button',f.name);option.type='button';option.setAttribute('role','menuitemradio');option.setAttribute('aria-checked',String(f.id===select.value));option.onclick=()=>{select.value=f.id;select.dispatchEvent(new Event('change',{bubbles:true}));closeFolderPicker()};menu.append(option)})}$('folderPickerBtn').onclick=()=>{const menu=$('folderPickerMenu');if(menu.hidden)refreshFolderPicker();menu.hidden=!menu.hidden;$('folderPickerBtn').setAttribute('aria-expanded',String(!menu.hidden))};document.addEventListener('pointerdown',e=>{if(!e.target.closest('.folder-picker'))closeFolderPicker()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFolderPicker()});$('targetFolder').addEventListener('change',()=>{updateHeading();refreshFolderPicker()});function currentSnapshot(){return JSON.stringify([$('title').value,$('content').value,$('targetFolder').value])}function markClean(){snapshot=currentSnapshot()}function updateMemoDates(){const n=state.notes.find(x=>x.id===editing);const fmt=t=>new Date(t).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});$('createdDate').textContent=n?'저장: '+fmt(n.created||n.updated):'';$('modifiedDate').textContent=n?'수정: '+fmt(n.updated):''}function clearEditor(){editing=null;updateMemoDates();$('title').value='';$('content').value='';renderChecklist();$('targetFolder').value=selected!=='all'?'default'===selected?'default':selected:'default';updateHeading();refreshFolderPicker();$('deleteCurrent').classList.add('hidden');$('moveMemo').classList.add('hidden');$('status').textContent='';markClean();$('title').focus()}function openNote(id){const n=state.notes.find(n=>n.id===id);if(!n)return;editing=id;updateMemoDates();$('title').value=n.title;$('content').value=n.content;renderChecklist();$('targetFolder').value=n.folder;updateHeading();refreshFolderPicker();$('deleteCurrent').classList.remove('hidden');$('moveMemo').classList.remove('hidden');$('status').textContent='';markClean();window.scrollTo({top:0,behavior:'smooth'})}function removeNote(id){const n=state.notes.find(n=>n.id===id);if(!n||!confirm(`'${n.title||'제목 없음'}' 메모를 삭제할까요?`))return;state.notes=state.notes.filter(x=>x.id!==id);persist();if(editing===id)clearEditor();render()}$('addFolder').onclick=()=>{const name=$('folderName').value.trim();if(!name)return alert('폴더 이름을 입력해 주세요.');if(state.folders.some(f=>f.name===name))return alert('같은 이름의 폴더가 있습니다.');const id=uid();state.folders.push({id,name});persist();$('folderName').value='';selected=id;expandedFolders.add(id);render();$('targetFolder').value=id;updateHeading()};$('folderName').addEventListener('keydown',e=>{if(e.key==='Enter')$('addFolder').click()});$('newMemo').onclick=()=>{if(currentSnapshot()!==snapshot&&($('title').value.trim()||$('content').value.trim())){$('unsavedDialog').showModal();return}clearEditor();document.body.classList.remove('sidebar-open')};$('cancelNew').onclick=()=>$('unsavedDialog').close();$('discardNew').onclick=()=>{$('unsavedDialog').close();clearEditor();document.body.classList.remove('sidebar-open')};$('saveNew').onclick=()=>{if(saveMemo()){$('unsavedDialog').close();clearEditor();document.body.classList.remove('sidebar-open')}};$('menuToggle').onclick=()=>document.body.classList.toggle('sidebar-open');$('sidebarClose').onclick=()=>document.body.classList.remove('sidebar-open');function positionSearchDialog(){const vv=window.visualViewport;const visibleTop=vv?vv.offsetTop:0;const visibleHeight=vv?vv.height:window.innerHeight;const dialog=$('searchDialog');const keyboardOpen=visibleHeight<window.innerHeight*0.82;const top=visibleTop+(keyboardOpen?12:Math.max(16,Math.min(visibleHeight*0.15,100)));dialog.style.setProperty('--search-top',top+'px');dialog.style.setProperty('--search-height',Math.max(160,visibleHeight-(top-visibleTop)-16)+'px')}

$('searchOpen').onclick=()=>{positionSearchDialog();$('searchDialog').showModal();$('searchQuery').focus();requestAnimationFrame(positionSearchDialog)};$('searchClose').onclick=()=>$('searchDialog').close();$('searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('searchQuery').value.trim().toLocaleLowerCase('ko');const results=$('searchResults');results.replaceChildren();if(!q){$('searchSummary').textContent='검색어를 입력해 주세요.';return}const matches=state.notes.filter(n=>[n.title,n.content,folderName(n.folder)].some(v=>(v||'').toLocaleLowerCase('ko').includes(q))).sort((a,b)=>b.updated-a.updated);$('searchSummary').textContent=matches.length+'개의 메모를 찾았습니다.';matches.forEach(n=>{const btn=el('button',undefined,'search-result');const heading=el('strong',n.title||'제목 없음');const meta=el('small',folderName(n.folder)+' · '+new Date(n.updated).toLocaleString('ko-KR'));const excerpt=el('span',(n.content||'').replace(/[☐☑] /g,'').replace(/\s+/g,' ').slice(0,110));btn.append(heading,meta,excerpt);btn.onclick=()=>{$('searchDialog').close();openNote(n.id);document.body.classList.remove('sidebar-open')};results.append(btn)})});document.querySelector('.workspace').addEventListener('pointerdown',e=>{if(document.body.classList.contains('sidebar-open')&&!e.target.closest('#menuToggle'))document.body.classList.remove('sidebar-open')});$('checkAdd').onclick=()=>{const area=$('content');const start=area.selectionStart;const before=area.value.slice(0,start),after=area.value.slice(start);const prefix=before.length&&!before.endsWith('\n')?'\n':'';const insertion=prefix+'☐ ';area.value=before+insertion+after;renderChecklist();if(!document.querySelector('.editor').classList.contains('checklist-mode')){area.focus();area.setSelectionRange(start+insertion.length,start+insertion.length)}else{const inputs=$('checkItems').querySelectorAll('.check-text');inputs[inputs.length-1]?.focus()}};$('convertAll').onclick=()=>{const area=$('content');const lines=area.value.split('\n');if(!lines
